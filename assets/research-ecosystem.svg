<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Ecosistema de investigación de Fernando Sandoval Gutierrez</title>
  <desc id="desc">Mapa visual de seis líneas de investigación articuladas alrededor de la práctica docente, conectadas con métodos, contextos y productos de ciencia abierta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1400" height="680" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2.6" fill="#7a263a">ECOSISTEMA DE INVESTIGACIÓN</text>
  <text x="70" y="116" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Problemas educativos, memoria, inclusión e infraestructura científica conectados en una misma agenda</text>

  <g stroke="#94a3b8" stroke-width="2" stroke-opacity="0.55">
    <line x1="700" y1="340" x2="350" y2="190"/>
    <line x1="700" y1="340" x2="1050" y2="190"/>
    <line x1="700" y1="340" x2="300" y2="420"/>
    <line x1="700" y1="340" x2="1100" y2="420"/>
    <line x1="700" y1="340" x2="470" y2="560"/>
    <line x1="700" y1="340" x2="930" y2="560"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="700" cy="340" r="118" fill="#172033"/>
    <circle cx="350" cy="190" r="88" fill="#8A1538"/>
    <circle cx="1050" cy="190" r="88" fill="#315A72"/>
    <circle cx="300" cy="420" r="88" fill="#455B55"/>
    <circle cx="1100" cy="420" r="88" fill="#6B4E71"/>
    <circle cx="470" cy="560" r="88" fill="#7C5A28"/>
    <circle cx="930" cy="560" r="88" fill="#3B5B92"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="700" y="320" font-size="25" font-weight="700">PRÁCTICA</text>
    <text x="700" y="351" font-size="25" font-weight="700">DOCENTE</text>
    <text x="700" y="382" font-size="14" fill="#d8e2ec">núcleo articulador</text>

    <text x="350" y="178" font-size="18" font-weight="700">INCLUSIÓN</text>
    <text x="350" y="202" font-size="15">diversidad · especial</text>

    <text x="1050" y="178" font-size="18" font-weight="700">INTERCULTURALIDAD</text>
    <text x="1050" y="202" font-size="15">rarámuri · migración</text>

    <text x="300" y="408" font-size="18" font-weight="700">HISTORIA</text>
    <text x="300" y="432" font-size="15">archivo · memoria escolar</text>

    <text x="1100" y="408" font-size="18" font-weight="700">EDUCACIÓN SUPERIOR</text>
    <text x="1100" y="432" font-size="15">innovación · institución</text>

    <text x="470" y="548" font-size="18" font-weight="700">FORMACIÓN DOCENTE</text>
    <text x="470" y="572" font-size="15">identidad · desarrollo</text>

    <text x="930" y="548" font-size="18" font-weight="700">HUMANIDADES DIGITALES</text>
    <text x="930" y="572" font-size="15">datos · API · preservación</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">
    <rect x="70" y="608" width="1260" height="38" rx="19" fill="#ffffff" opacity="0.94"/>
    <text x="700" y="632" text-anchor="middle">Métodos y productos: investigación histórica · análisis cualitativo · revisión documental · historia oral · datasets · recursos abiertos · software de investigación</text>
  </g>
</svg>