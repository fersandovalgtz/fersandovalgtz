<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Fernando Sandoval Gutierrez — Research profile</title>
  <desc id="desc">Scientific profile header connecting educational research, inclusion, interculturality, history of education, digital humanities and open science.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.58" stop-color="#172033"/>
      <stop offset="1" stop-color="#351923"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="24" fill="url(#grid)"/>

  <g opacity="0.92" stroke="#9fb3c8" stroke-opacity="0.42" stroke-width="1.6">
    <line x1="965" y1="180" x2="1085" y2="78"/>
    <line x1="965" y1="180" x2="1190" y2="128"/>
    <line x1="965" y1="180" x2="1230" y2="245"/>
    <line x1="965" y1="180" x2="1080" y2="292"/>
    <line x1="1085" y1="78" x2="1190" y2="128"/>
    <line x1="1190" y1="128" x2="1230" y2="245"/>
    <line x1="1230" y1="245" x2="1080" y2="292"/>
    <line x1="1080" y1="292" x2="965" y2="180"/>
    <line x1="1085" y1="78" x2="1310" y2="76"/>
    <line x1="1230" y1="245" x2="1325" y2="304"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="965" cy="180" r="17" fill="#d7e3ef"/>
    <circle cx="1085" cy="78" r="10" fill="#a6c8e3"/>
    <circle cx="1190" cy="128" r="12" fill="#c69ca9"/>
    <circle cx="1230" cy="245" r="11" fill="#a6c8e3"/>
    <circle cx="1080" cy="292" r="9" fill="#c69ca9"/>
    <circle cx="1310" cy="76" r="7" fill="#d7e3ef"/>
    <circle cx="1325" cy="304" r="7" fill="#d7e3ef"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f8fafc">
    <text x="72" y="112" font-size="20" letter-spacing="3.2" fill="#b7c7d8">RESEARCH PROFILE · EDUCATION · OPEN SCIENCE</text>
    <text x="72" y="174" font-size="46" font-weight="700">Fernando Sandoval Gutierrez</text>
    <text x="72" y="220" font-size="24" fill="#d3dde8">Educational research · inclusion · interculturality · history of education</text>
    <text x="72" y="256" font-size="24" fill="#d3dde8">digital humanities · research infrastructure · open scholarly resources</text>
    <text x="72" y="310" font-size="17" fill="#9fb3c8">Universidad Autónoma de Ciudad Juárez · México</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#dce6f0">
    <text x="991" y="176">research</text>
    <text x="1098" y="65">inclusion</text>
    <text x="1208" y="116">interculturality</text>
    <text x="1248" y="250">digital humanities</text>
    <text x="1094" y="312">history</text>
  </g>
</svg>