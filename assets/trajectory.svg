<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Trayectoria académica y científica 2003–2026</title>
  <desc id="desc">Cronología de hitos de publicación, incorporación a la UACJ, doctorado, consolidación de investigación educativa y expansión hacia humanidades digitales.</desc>
  <rect width="1400" height="420" rx="28" fill="#111827"/>
  <text x="70" y="72" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2.5" fill="#d7b2bd">TRAYECTORIA · 2003—2026</text>
  <text x="70" y="108" font-family="Inter,Arial,sans-serif" font-size="17" fill="#b8c4d1">De la historia de la educación y la práctica docente a la infraestructura científica abierta</text>

  <line x1="105" y1="225" x2="1290" y2="225" stroke="#64748b" stroke-width="4"/>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g>
      <circle cx="145" cy="225" r="13" fill="#d7b2bd"/>
      <text x="145" y="184" font-size="22" font-weight="700" fill="#f8fafc">2003</text>
      <text x="145" y="270" font-size="14" fill="#d8e2ec">La escuela Modelo</text>
      <text x="145" y="291" font-size="13" fill="#94a3b8">historia educativa</text>
    </g>
    <g>
      <circle cx="360" cy="225" r="13" fill="#9fc5d9"/>
      <text x="360" y="184" font-size="22" font-weight="700" fill="#f8fafc">2009</text>
      <text x="360" y="270" font-size="14" fill="#d8e2ec">UACJ Cuauhtémoc</text>
      <text x="360" y="291" font-size="13" fill="#94a3b8">profesor-investigador</text>
    </g>
    <g>
      <circle cx="575" cy="225" r="13" fill="#a7c7b7"/>
      <text x="575" y="184" font-size="22" font-weight="700" fill="#f8fafc">2015</text>
      <text x="575" y="270" font-size="14" fill="#d8e2ec">Doctor en Educación</text>
      <text x="575" y="291" font-size="13" fill="#94a3b8">UACH</text>
    </g>
    <g>
      <circle cx="790" cy="225" r="13" fill="#d5b67b"/>
      <text x="790" y="184" font-size="22" font-weight="700" fill="#f8fafc">2020</text>
      <text x="790" y="270" font-size="14" fill="#d8e2ec">Memoria e inclusión</text>
      <text x="790" y="291" font-size="13" fill="#94a3b8">historia oral · especial</text>
    </g>
    <g>
      <circle cx="1005" cy="225" r="13" fill="#baa4c5"/>
      <text x="1005" y="184" font-size="22" font-weight="700" fill="#f8fafc">2025</text>
      <text x="1005" y="270" font-size="14" fill="#d8e2ec">Expansión temática</text>
      <text x="1005" y="291" font-size="13" fill="#94a3b8">paz · superior · inclusión</text>
    </g>
    <g>
      <circle cx="1220" cy="225" r="16" fill="#7da3d8"/>
      <text x="1220" y="184" font-size="22" font-weight="700" fill="#f8fafc">2026</text>
      <text x="1220" y="270" font-size="14" fill="#d8e2ec">Rarámuri Digital</text>
      <text x="1220" y="291" font-size="13" fill="#94a3b8">datos · API · ciencia abierta</text>
    </g>
  </g>

  <rect x="70" y="340" width="1260" height="42" rx="21" fill="#172033" stroke="#334155"/>
  <text x="700" y="367" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#cbd5e1">Continuidad temática: escuela · docencia · contexto · alteridad · memoria · interculturalidad · infraestructura para investigación</text>
</svg>